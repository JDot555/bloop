<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Coin Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      margin-top: -5px;
      background-color: white;
      border-radius: 50%;
      z-index: 9999;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      font-family: sans-serif;
      font-size: 20px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="hud">XP: 0</div>
  <audio id="coinSound" src="coins.mp3" preload="auto"></audio>
  <script type="module" src="./main.js"></script>
</body>
</html>
